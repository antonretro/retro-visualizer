<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectrum - Retro Visualizer</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#e7eef5;font:13px/1.4 system-ui,Segoe UI,sans-serif;overflow:hidden}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:#000}
#stage.pixel{image-rendering:pixelated;image-rendering:crisp-edges}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:26px 14px 12px;
  background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.5) 65%,transparent);transition:opacity .35s}
.bar.hide{opacity:0;pointer-events:none}
body.idle{cursor:none}
#other{text-decoration:none}
button,#other,select{font:600 12px system-ui,Segoe UI,sans-serif;color:#e7eef5;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:5px;padding:6px 10px;cursor:pointer}
button:hover,#other:hover,select:hover{background:rgba(255,255,255,.14)}
button.on{background:#2d7fb8;border-color:#2d7fb8}
select{max-width:240px}
select option{background:#111}
.vol{display:flex;align-items:center;gap:4px;color:#c8d3dd;font-size:14px}.vol input{width:90px;accent-color:#5aa0e0}
#status{flex:1 1 160px;color:#93a4b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
input[type=file]{display:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="bar" id="bar">
  <button id="prev" title="Previous preset (Left)">&#9664;</button>
  <select id="preset" title="Preset"></select>
  <button id="next" title="Next preset (Right)">&#9654;</button>
  <span id="music"></span>
  <span id="status"></span>
  <label class="vol" title="Volume (Up / Down)">&#128266;<input type="range" id="vol" min="0" max="100" step="1" value="80"></label>
  <button id="classic" title="Classic styles from your own Windows">Classic</button>
  <a id="other" href="../battery/index.html" title="Switch visualizer">Plasma</a>
  <button id="look" title="Pixel (sharp, like the original) or Smooth (S). Only matters when the image is scaled.">Pixel</button>
  <button id="fit" title="Widescreen (draws at your window's own size, like the original), Stretch 4:3 (640x480 stretched to the window) or Boxed 4:3 (A)">Widescreen</button>
  <button id="fs" title="Fullscreen (F)">Fullscreen</button>
</div>
<script src="barswaves.js"></script>
<script src="../common/brand.js"></script>
<script src="../common/midi-sf2.js"></script>
<script src="../common/wmpaudio.js"></script>
<script src="../common/music.js"></script>
<script src="../common/classic.js"></script>
<script src="../common/classic-ui.js"></script>
<script>
// Player. Plain ES2015 script (works from file://, no modules, no build).
//
// Bars and Waves has no internal resolution: the real one draws straight into a DIB the size of the
// visualization window, 1 pixel = 1 screen pixel (bar widths, peak lines and the scope line are in pixels).
// Screen modes:
//   wide    (default) the engine draws at the window's own size in CSS pixels, exactly what WMP does in a
//           window of that shape. Nothing is stretched; wider windows simply get more/wider bars.
//   stretch the engine draws at 640x480 and the picture is stretched to the window (old 4:3 look).
//   boxed   the engine draws at the largest 4:3 rectangle that fits the window, 1:1, centred, black around.
// On high-DPI screens the CSS-pixel image is scaled by devicePixelRatio (Pixel = sharp, Smooth = bilinear).
//
// Audio: all sources, the Music panel and the TimedLevel come from ../common/music.js (same as Battery).
// MediaInfo is called with 2 channels, so the bars use the louder of the two channels like WMP does for stereo.
// Timing: the engine is stepped at a fixed 30 steps/s (one Render call each), whatever the display rate.
(function () {
  'use strict';
  var BW = window.BarsWaves, BR = window.BRAND;
  document.title = BR.spectrum + ' - ' + BR.name;
  document.getElementById('other').textContent = BR.plasma;
  var classicUi = null;
  function styleList() { var p = classicUi && classicUi.active(); return BW.STYLES.concat(p && p.barswaves ? p.barswaves : []); }
  var STEP_MS = 1000 / 30;
  var store = {}; try { store = JSON.parse(localStorage.getItem('barswaves.settings') || '{}'); } catch (e) {}
  var look = store.look === 'smooth' ? 'smooth' : 'pixel';
  var screenMode = store.screen === 'boxed' || store.screen === 'stretch' ? store.screen : 'wide';
  var vol = typeof store.vol === 'number' ? Math.max(0, Math.min(100, store.vol)) : 80;
  var presetSaved = typeof store.preset === 'number' ? store.preset : 0;
  function save() { try { localStorage.setItem('barswaves.settings', JSON.stringify({ look: look, screen: screenMode, vol: vol, preset: E.presetIndex })); } catch (e) {} }

  var E = new BW.Engine({ seed: 1 });
  E.mediaInfo(2);
  E.setPreset(Math.max(0, Math.min(E.presets.length - 1, presetSaved | 0)));

  var stage = document.getElementById('stage'), ctx = stage.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var sel = $('preset'), statusEl = $('status');

  // ---- engine size for the current screen mode (CSS pixels)
  function engineSize() {
    var w = Math.max(1, Math.floor(window.innerWidth || 640)), h = Math.max(1, Math.floor(window.innerHeight || 480));
    if (screenMode === 'stretch') return [640, 480];
    if (screenMode === 'boxed') { var s = Math.min(w / 4, h / 3); return [Math.max(4, Math.floor(s * 4)), Math.max(3, Math.floor(s * 3))]; }
    return [w, h];
  }
  var off = document.createElement('canvas'), octx = off.getContext('2d'), img = null, img32 = null, EW = 0, EH = 0;
  function ensureImage() {
    var sz = engineSize();
    if (sz[0] !== EW || sz[1] !== EH) {
      EW = sz[0]; EH = sz[1];
      off.width = EW; off.height = EH; img = octx.createImageData(EW, EH); img32 = new Uint32Array(img.data.buffer);
      E.resize(EW, EH);   // like WMP: a new DIB when the window size changes (trails restart)
    }
  }
  ensureImage();

  // ---- style menu: our own styles, plus the classic ones from the user's Windows when loaded and switched on
  function fillMenu() {
    sel.textContent = '';
    E.presets.forEach(function (p, i) { var o = document.createElement('option'); o.value = i; o.textContent = p.title; sel.appendChild(o); });
    sel.value = String(E.presetIndex);
  }
  function applyList() { E.setStyles(styleList()); E.setPreset(0); fillMenu(); }
  classicUi = ClassicUI.mount({ button: $('classic'), onChange: function () { applyList(); save(); } });
  if (classicUi.active()) { E.setStyles(styleList()); E.setPreset(Math.max(0, Math.min(E.presets.length - 1, presetSaved | 0))); }
  fillMenu();
  function setPreset(i) {
    var n = E.presets.length; i = ((i % n) + n) % n;
    E.setPreset(i); sel.value = String(i); save();
  }
  sel.onchange = function () { setPreset(+sel.value); sel.blur(); };
  $('prev').onclick = function () { setPreset(E.presetIndex - 1); };
  $('next').onclick = function () { setPreset(E.presetIndex + 1); };

  // ---- music: every audio source, the Music panel and the TimedLevel come from ../common/music.js
  var music = WmpMusic.create({
    bar: $('music'), volume: vol,
    // exact WMP analysis (Resampler DMO visualization mode, see re/audio/WMP_AUDIO_SPEC.md)
    analyzer: window.WmpAudio ? WmpMusic.pcmStage(WmpAudio.createAnalyzer) : undefined,
    onStatus: function (t) { statusEl.textContent = t; },
    onActivity: function () { poke(); }
  });
  var tl = new Uint8Array(4096);
  var level = { tl: tl, freq: [tl.subarray(0, 1024), tl.subarray(1024, 2048)], wave: [tl.subarray(2048, 3072), tl.subarray(3072, 4096)], state: 2 };

  // ---- presentation
  function resizeStage() {
    var dpr = window.devicePixelRatio || 1;
    stage.width = Math.max(1, Math.round(innerWidth * dpr)); stage.height = Math.max(1, Math.round(innerHeight * dpr));
  }
  var reshapeT = 0;
  window.addEventListener('resize', function () {
    resizeStage();
    clearTimeout(reshapeT);
    reshapeT = setTimeout(function () { ensureImage(); present(); }, 150);   // new size once resizing settles
  });
  resizeStage();
  function present() {
    E.toRGBA(img32); octx.putImageData(img, 0, 0);
    var smooth = look === 'smooth';
    stage.classList.toggle('pixel', !smooth);
    ctx.imageSmoothingEnabled = smooth;
    if (smooth) ctx.imageSmoothingQuality = 'high';
    var cw = stage.width, ch = stage.height;
    if (screenMode !== 'boxed') ctx.drawImage(off, 0, 0, cw, ch);
    else {
      var s = Math.min(cw / EW, ch / EH), dw = Math.round(EW * s), dh = Math.round(EH * s);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(off, (cw - dw) >> 1, (ch - dh) >> 1, dw, dh);
    }
  }
  var SCREEN_LABEL = { stretch: 'Stretch 4:3', boxed: 'Boxed 4:3', wide: 'Widescreen' };
  function labels() { $('fit').textContent = SCREEN_LABEL[screenMode]; $('look').textContent = look === 'smooth' ? 'Smooth' : 'Pixel'; }
  $('fit').onclick = function () {
    screenMode = screenMode === 'wide' ? 'stretch' : screenMode === 'stretch' ? 'boxed' : 'wide';
    ensureImage(); save(); labels(); present();
  };
  $('look').onclick = function () { look = look === 'smooth' ? 'pixel' : 'smooth'; save(); labels(); present(); };
  labels();
  var volEl = $('vol'); volEl.value = vol;
  function setVol(v) {
    vol = Math.max(0, Math.min(100, Math.round(v))); volEl.value = vol;
    music.setVolume(vol);
    save();
  }
  volEl.oninput = function () { setVol(+volEl.value); };

  // ---- fixed 30 steps/s loop (each step = one Render call with a new TimedLevel)
  var acc = 0, lastT = null;
  function tick(now) {
    if (lastT === null) lastT = now;
    acc += Math.min(250, now - lastT); lastT = now;
    var steps = 0;
    while (acc >= STEP_MS && steps < 4) {
      acc -= STEP_MS; steps++;
      if (!music.isPaused()) { music.sampleLevel(level); level.state = 2; E.frame(level); }
    }
    if (steps) present();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---- fullscreen, keyboard, auto-hide
  function toggleFs() {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  $('fs').onclick = toggleFs;
  stage.ondblclick = toggleFs;
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT')) return;
    var k = e.key;
    if (k === 'ArrowRight') setPreset(E.presetIndex + 1);
    else if (k === 'ArrowLeft') setPreset(E.presetIndex - 1);
    else if (k === ' ') { music.togglePause(); e.preventDefault(); }
    else if (k === 'f' || k === 'F') toggleFs();
    else if (k === 'a' || k === 'A') $('fit').onclick.call($('fit'));
    else if (k === 's' || k === 'S') $('look').onclick.call($('look'));
    else if (k === 'ArrowUp') { setVol(vol + 5); e.preventDefault(); }
    else if (k === 'ArrowDown') { setVol(vol - 5); e.preventDefault(); }
    else return;
    poke();
  });
  var bar = $('bar'), hideTimer = 0;
  function poke() {
    bar.classList.remove('hide'); music.setUiHidden(false); document.body.classList.remove('idle');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { if (!bar.matches(':hover') && !music.isActive()) { bar.classList.add('hide'); music.setUiHidden(true); document.body.classList.add('idle'); } else poke(); }, 2500);
  }
  ['mousemove', 'mousedown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, poke, { passive: true }); });
  poke();
})();
</script>
</body>
</html>
