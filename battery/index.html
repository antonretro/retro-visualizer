<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plasma - Retro Visualizer</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#e7eef5;font:13px/1.4 system-ui,Segoe UI,sans-serif;overflow:hidden}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:26px 14px 12px;
  background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.5) 65%,transparent);transition:opacity .35s}
.bar.hide{opacity:0;pointer-events:none}
body.idle{cursor:none}
#home{text-decoration:none}
button,#home,select{font:600 12px system-ui,Segoe UI,sans-serif;color:#e7eef5;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:5px;padding:6px 10px;cursor:pointer}
button:hover,#home:hover,select:hover{background:rgba(255,255,255,.14)}
button.on{background:#2d7fb8;border-color:#2d7fb8}
select{max-width:240px}
select option{background:#111}
select optgroup{background:#1a2430;color:#8fc4f0}
.vol{display:flex;align-items:center;gap:4px;color:#c8d3dd;font-size:14px}.vol input{width:90px;accent-color:#5aa0e0}
#status{flex:1 1 160px;color:#93a4b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
input[type=file]{display:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="bar" id="bar">
  <select id="vis" title="Visualizer"><option value="../battery/index.html" selected>Plasma</option><option value="../barswaves/index.html">Spectrum</option></select>
  <button id="prev" title="Previous preset (Left)">&#9664;</button>
  <select id="preset" title="Preset"></select>
  <button id="next" title="Next preset (Right)">&#9654;</button>
  <span id="music"></span>
  <span id="status"></span>
  <label class="vol" title="Volume (Up / Down)">&#128266;<input type="range" id="vol" min="0" max="100" step="1" value="80"></label>
  <button id="setup" title="Set up Windows extras: classic presets, Windows sound, sample songs">Setup</button>
  <button id="classic" title="Classic presets from your own Windows">Classic</button>
  <a id="home" href="../home.html" title="Home: start page, about">&#8962;</a>
  <button id="look" title="Pixel (sharp, like the original) or Smooth (S)">Pixel</button>
  <button id="motion" title="Motion: 30 fps like the original, or Smooth (blends frames at your screen's refresh rate: 60, 144, 240 Hz...). The visualizer itself always runs at its original 30 steps per second.">30 fps</button>
  <button id="fit" title="Widescreen (fits your window, never stretched), Stretch 4:3 like the original, or Boxed 4:3 (A)">Widescreen</button>
  <button id="fs" title="Fullscreen (F)">Fullscreen</button>
</div>
<script src="engine.js"></script>
<script src="shifts.js"></script>
<script src="edges.js"></script>
<script src="drawers.js"></script>
<script src="core.js"></script>
<script src="presets.js"></script>
<script src="extras.js"></script>
<script src="extras-presets.js"></script>
<script src="unused-presets.js"></script>
<script src="collection.js"></script>
<script src="../common/brand.js"></script>
<script src="../common/midi-sf2.js"></script>
<script src="../common/wmpaudio.js"></script>
<script src="../common/music.js"></script>
<script src="../common/classic.js"></script>
<script src="../common/classic-ui.js"></script>
<script src="../common/setup.js"></script>
<script>
// Player. Plain ES2015 script (works from file://, no modules, no build).
//
// Audio: every source (files, folders, MIDI/SoundFont, internet radio, mic, demo beat), the Music panel and the
// Audio -> TimedLevel mapping live in ../common/music.js (see its header; the analyzer stage is swappable).
// Timing: Battery counts frames, never wall-clock time. The engine is stepped at a fixed 30 steps/s,
// whatever the display refresh rate; each step samples the level once (music.sampleLevel).
(function () {
  'use strict';
  var B = window.Battery, BR = window.BRAND;
  document.title = BR.plasma + ' - ' + BR.name;
  var vis = document.getElementById('vis');
  vis.options[0].textContent = BR.plasma; vis.options[1].textContent = BR.spectrum;
  vis.onchange = function () {   // an active choice: the site (index.html) opens into this visualizer next time
    try { localStorage.setItem('retro.visualizer', vis.selectedIndex ? 'barswaves' : 'battery'); } catch (e) {}
    location.href = vis.value;
  };
  // Preset menu groups:
  //   classic presets loaded from the user's Windows (and on): Originals (Random (classic) + the classic presets),
  //     built-in presets, Originals never used in a preset, New (Anthony's collection: Random (everything) + extras)
  //   otherwise: Random + built-in presets, Never-used parts, Anthony's collection
  var classicUi = null;
  function classicPresets() { var p = classicUi && classicUi.active(); return p && p.battery && p.battery.length ? p.battery : null; }
  var BUILTIN = B.PRESETS || [];
  // drop-in collection entries (collection.js) other than Anthony's collection itself, shown with the collection
  var COLL_MORE = (B.COLLECTION || []).filter(function (p) { return (B.EXTRA_PRESETS || []).indexOf(p) < 0 && (B.UNUSED_PRESETS || []).indexOf(p) < 0; });
  var groups = [];   // [{ label, start }] in menu order, start = first preset index of the group
  // the preset the user actively picked (by title, so it survives the classic presets loading later); none = Random
  var picked = null; try { picked = localStorage.getItem('battery.preset'); } catch (e) {}
  function pickedIndex() {
    if (!picked) return 0;
    for (var i = 1; i < E.presets.length; i++) if (E.presets[i].title === picked) return i;
    return 0;
  }
  var STEP_MS = 1000 / 30;
  // Settings (remembered): look = 'pixel' (nearest, like WMP) | 'smooth' (bilinear)
  // screen = 'stretch' (4:3 buffer stretched to the window, like WMP) | 'boxed' (4:3, black bars)
  //        | 'wide' (modern default: the buffer is 288 rows high and as wide as the window's real shape,
  //          e.g. 512x288 on 16:9, 672x288 on 21:9, so nothing is ever stretched. All Battery geometry is
  //          isotropic (polar shifts, round circles), so a wider buffer just shows more of the pattern.)
  var store = {}; try { store = JSON.parse(localStorage.getItem('battery.settings2') || '{}'); } catch (e) {}
  var look = store.look === 'smooth' ? 'smooth' : 'pixel';
  var motion = store.motion === 'smooth' ? 'smooth' : 'original';   // 'original' = 30 fps like the original
  var screenMode = store.screen === 'boxed' || store.screen === 'stretch' ? store.screen : 'wide';
  function save() { try { localStorage.setItem('battery.settings2', JSON.stringify({ look: look, screen: screenMode, vol: vol, motion: motion })); } catch (e) {} }
  var vol = typeof store.vol === 'number' ? Math.max(0, Math.min(100, store.vol)) : 80;
  function wideW() {   // buffer width matching the window aspect at 288 rows (even, 256..1024)
    var a = (window.innerWidth || 4) / Math.max(1, window.innerHeight || 3);
    return Math.max(256, Math.min(1024, Math.round(288 * a / 2) * 2));
  }

  var E, W, H, off, octx, img, img32, offPrev, pctx;
  function addCycles(list, sort) {
    var ps = sort ? B.sortPresets(list) : list;
    for (var i = 0; i < ps.length; i++) E.presets.push(new B.Cycle(E, ps[i]));
  }
  function makeEngine(presetIndex) {
    var old = E, wide = screenMode === 'wide', cp = classicPresets();
    E = new B.Engine({ presets: cp || BUILTIN, seed: (Date.now() / 1000) | 0, W: wide ? wideW() : 384, H: 288 });
    E.presets[0].title = cp ? 'Random (classic)' : 'Random';
    groups = [{ label: cp ? 'Originals' : BR.name + ' presets', start: 0 }];
    if (cp && BUILTIN.length) { groups.push({ label: BR.name + ' presets', start: E.presets.length }); addCycles(BUILTIN, true); }
    if (B.installUnused) { groups.push({ label: cp ? 'Originals never used in a preset' : 'Never-used parts', start: E.presets.length }); B.installUnused(E); }
    var nStart = E.presets.length;
    if (B.Extras) B.Extras.install(E);
    addCycles(COLL_MORE, false);
    if (E.presets.length > nStart) groups.push({ label: cp ? '\u2726 New (Anthony\'s collection)' : '\u2726 Anthony\'s collection', start: nStart });
    if (presetIndex < 0) presetIndex = pickedIndex();   // -1: the preset the user picked before, else Random
    if (presetIndex >= E.presets.length) presetIndex = 0;
    if (old) { E.pal.set(old.pal); E.palFrom.set(old.palFrom); E.palTarget.set(old.palTarget); }   // no colour flash
    if (presetIndex) E.setPreset(presetIndex);
    W = E.W; H = E.H;
    off = document.createElement('canvas'); off.width = W; off.height = H;
    offPrev = document.createElement('canvas'); offPrev.width = W; offPrev.height = H; pctx = offPrev.getContext('2d');
    octx = off.getContext('2d'); img = octx.createImageData(W, H); img32 = new Uint32Array(img.data.buffer);
  }
  makeEngine(-1);

  var stage = document.getElementById('stage'), ctx = stage.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var sel = $('preset'), statusEl = $('status');

  // ---- preset menu, in groups (see above); Random (classic) / Random is the default
  function fillMenu() {
    sel.textContent = '';
    var g = null, gi = 0;
    E.presets.forEach(function (p, i) {
      while (gi < groups.length && groups[gi].start <= i) {
        g = document.createElement('optgroup'); g.label = groups[gi].label; sel.appendChild(g); gi++;
      }
      var o = document.createElement('option'); o.value = i; o.textContent = p.title; (g || sel).appendChild(o);
    });
    sel.value = String(E.presetIndex);
  }
  fillMenu();
  classicUi = ClassicUI.mount({ button: $('classic'), onChange: function () { makeEngine(-1); fillMenu(); } });
  if (classicUi.active()) { makeEngine(-1); fillMenu(); }
  function setPreset(i) {
    var n = E.presets.length; i = ((i % n) + n) % n;
    E.setPreset(i);
    sel.value = String(i);
  }
  function pick(i) {   // an active choice (menu, arrows, keys): remembered; Random = nothing remembered
    setPreset(i);
    picked = E.presetIndex ? E.presets[E.presetIndex].title : null;
    try { if (picked) localStorage.setItem('battery.preset', picked); else localStorage.removeItem('battery.preset'); } catch (e) {}
  }
  sel.onchange = function () { pick(+sel.value); sel.blur(); };
  $('prev').onclick = function () { pick(E.presetIndex - 1); };
  $('next').onclick = function () { pick(E.presetIndex + 1); };

  // ---- music: every audio source, the Music panel and the TimedLevel come from ../common/music.js
  var music = WmpMusic.create({
    bar: $('music'), volume: vol,
    // exact WMP analysis (Resampler DMO visualization mode, see re/audio/WMP_AUDIO_SPEC.md)
    analyzer: window.WmpAudio ? WmpMusic.pcmStage(WmpAudio.createAnalyzer) : undefined,
    onStatus: function (t) { statusEl.textContent = t; },
    onActivity: function () { poke(); }
  });
  RetroSetup.mount({ button: $('setup'), music: music });
  var tl = new Uint8Array(4096);   // one TimedLevel block; freq/wave are views of it (drawers read it without copying)
  var level = { tl: tl, freq: [tl.subarray(0, 1024), tl.subarray(1024, 2048)], wave: [tl.subarray(2048, 3072), tl.subarray(3072, 4096)], state: 2 };

  // ---- presentation: nearest-neighbour scaling of the 8-bit index buffer through the palette
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    stage.width = Math.max(1, Math.round(innerWidth * dpr)); stage.height = Math.max(1, Math.round(innerHeight * dpr));
  }
  window.addEventListener('resize', resize); resize();
  // in widescreen, follow the window's shape (rebuild the buffer once resizing settles)
  var reshapeT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(reshapeT);
    reshapeT = setTimeout(function () { if (screenMode === 'wide' && Math.abs(wideW() - W) > 2) makeEngine(E.presetIndex); }, 250);
  });
  // a new engine frame: keep the previous one (for Smooth motion), then convert the new one
  function newFrame() {
    pctx.drawImage(off, 0, 0);
    E.toRGBA(img32); octx.putImageData(img, 0, 0);
  }
  // draw: t = 0..1 position between the previous and the newest frame (Smooth motion); 1 = newest only
  function present(t) {
    ctx.imageSmoothingEnabled = look === 'smooth';
    if (look === 'smooth') ctx.imageSmoothingQuality = 'high';
    var cw = stage.width, ch = stage.height, x = 0, y = 0, dw = cw, dh = ch;
    if (screenMode === 'boxed') {
      var s = Math.min(cw / W, ch / H); dw = Math.round(W * s); dh = Math.round(H * s);
      x = (cw - dw) >> 1; y = (ch - dh) >> 1;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch);
    }
    if (t < 1) { ctx.globalAlpha = 1; ctx.drawImage(offPrev, x, y, dw, dh); ctx.globalAlpha = t; }
    ctx.drawImage(off, x, y, dw, dh);
    ctx.globalAlpha = 1;
  }
  var SCREEN_LABEL = { stretch: 'Stretch 4:3', boxed: 'Boxed 4:3', wide: 'Widescreen' };
  function labels() { $('fit').textContent = SCREEN_LABEL[screenMode]; $('look').textContent = look === 'smooth' ? 'Smooth' : 'Pixel'; }
  $('fit').onclick = function () {
    var was = screenMode;
    screenMode = screenMode === 'wide' ? 'stretch' : screenMode === 'stretch' ? 'boxed' : 'wide';
    if ((was === 'wide') !== (screenMode === 'wide')) makeEngine(E.presetIndex);   // buffer size changes
    save(); labels();
  };
  $('look').onclick = function () { look = look === 'smooth' ? 'pixel' : 'smooth'; save(); labels(); };
  // Motion: measured screen refresh rate shown on the button in Smooth mode
  var hz = 60, hzAcc = 0, hzN = 0;
  function motionLabel() { $('motion').textContent = motion === 'smooth' ? 'Smooth ' + hz + ' Hz' : '30 fps'; }
  $('motion').onclick = function () { motion = motion === 'smooth' ? 'original' : 'smooth'; save(); motionLabel(); };
  motionLabel();
  labels();
  var volEl = $('vol'); volEl.value = vol;
  function setVol(v) {
    vol = Math.max(0, Math.min(100, Math.round(v))); volEl.value = vol;
    music.setVolume(vol);
    save();
  }
  volEl.oninput = function () { setVol(+volEl.value); };

  // ---- fixed 30 steps/s loop
  var acc = 0, lastT = null;
  function tick(now) {
    if (lastT === null) lastT = now;
    acc += Math.min(250, now - lastT); lastT = now;
    var steps = 0;
    while (acc >= STEP_MS && steps < 4) {
      acc -= STEP_MS; steps++;
      if (!music.isPaused()) { music.sampleLevel(level); level.state = 2; E.frame(level); }
    }
    if (steps) newFrame();
    if (motion === 'smooth') present(Math.max(0, Math.min(1, acc / STEP_MS)));
    else if (steps) present(1);
    // measure the display refresh rate (for the Smooth label)
    var dt = now - (tick.prev || now); tick.prev = now;
    if (dt > 2 && dt < 100) { hzAcc += dt; if (++hzN >= 60) { var h = Math.round(1000 / (hzAcc / hzN)); hzAcc = hzN = 0; if (Math.abs(h - hz) > 2) { hz = h; motionLabel(); } } }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---- fullscreen, keyboard, auto-hide
  function toggleFs() {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  $('fs').onclick = toggleFs;
  stage.ondblclick = toggleFs;
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT')) return;
    var k = e.key;
    if (k === 'ArrowRight') pick(E.presetIndex + 1);
    else if (k === 'ArrowLeft') pick(E.presetIndex - 1);
    else if (k === ' ') { music.togglePause(); e.preventDefault(); }
    else if (k === 'f' || k === 'F') toggleFs();
    else if (k === 'a' || k === 'A') $('fit').onclick.call($('fit'));
    else if (k === 's' || k === 'S') $('look').onclick.call($('look'));
    else if (k === 'ArrowUp') { setVol(vol + 5); e.preventDefault(); }
    else if (k === 'ArrowDown') { setVol(vol - 5); e.preventDefault(); }
    else if (k === 'm' || k === 'M') E.presets[E.presetIndex].newMovement();   // Battery's own m/e keys
    else if (k === 'e' || k === 'E') E.presets[E.presetIndex].newEffects();
    else return;
    poke();
  });
  var bar = $('bar'), hideTimer = 0;
  function poke() {
    bar.classList.remove('hide'); music.setUiHidden(false); document.body.classList.remove('idle');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { if (!bar.matches(':hover') && !music.isActive()) { bar.classList.add('hide'); music.setUiHidden(true); document.body.classList.add('idle'); } else poke(); }, 2500);
  }
  ['mousemove', 'mousedown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, poke, { passive: true }); });
  poke();
  if (E.warnings.length) statusEl.textContent += '  (' + E.warnings.length + ' classes missing)';
})();
</script>
</body>
</html>
