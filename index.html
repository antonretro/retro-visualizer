<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Visualizer</title>
<noscript><meta http-equiv="refresh" content="0; url=battery/index.html"></noscript>
<style>html,body{margin:0;height:100%;background:#000;color:#93a4b4;font:14px system-ui,Segoe UI,sans-serif}a{color:#5aa0e0}p{margin:0;padding:20px}</style>
<script>
// The site opens straight into a visualizer: Plasma, unless the user actively picked Spectrum last time
// (the visualizer menu in the players or a card on home.html). The start page is home.html (Home button).
(function () {
  var v = null; try { v = localStorage.getItem('retro.visualizer'); } catch (e) {}
  location.replace((v === 'barswaves' ? 'barswaves' : 'battery') + '/index.html' + location.search + location.hash);
})();
</script>
</head>
<body>
<p>Opening the visualizer... <a href="battery/index.html">Plasma</a> - <a href="barswaves/index.html">Spectrum</a> - <a href="home.html">Home</a></p>
</body>
</html>
